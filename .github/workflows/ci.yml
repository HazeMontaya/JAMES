name: JAMES CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: james-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Run tests
        run: cargo test --workspace

  python:
    name: Python sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Run tests
        run: python -m pytest -q

  discovery:
    name: Windows discovery tool
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/discovery/package-lock.json
      - run: npm ci
      - run: npm test
