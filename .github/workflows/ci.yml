name: JAMES CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: james-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit canonical layout
        run: python scripts/audit-repository-structure.py

  rust:
    name: Rust workspace (Windows MSVC)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: runtime/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          rustc -vV
          cargo -vV
          rustup target list --installed
          if (-not ((rustup target list --installed) -contains "x86_64-pc-windows-msvc")) {
            throw "Required MSVC target is not installed."
          }
      - name: Check workspace
        run: cargo check --workspace --target x86_64-pc-windows-msvc
      - name: Run tests
        run: cargo test --workspace --target x86_64-pc-windows-msvc

  python:
    name: Python sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/python/sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  discovery:
    name: Windows discovery tool
    runs-on: windows-latest
    defaults:
      run:
        working-directory: runtime/tools/discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: runtime/tools/discovery/package-lock.json
      - run: npm ci
      - run: npm test
