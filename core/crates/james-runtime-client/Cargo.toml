[package]
name = "james-runtime-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JAMES Runtime gRPC Client"

[dependencies]
tonic = { version = "0.10", features = ["tls", "transport"] }
prost = "0.12"
prost-types = "0.12"
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.10"
prost-build = "0.12"
protoc-bin-vendored = "3.2"