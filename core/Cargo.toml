[workspace]
resolver = "2"
members = [
    "crates/james-core",
    "crates/james-errors",
    "crates/james-events",
    "crates/james-registry",
    "crates/james-capabilities",
    "crates/james-capability-broker",
    "crates/james-services",
    "crates/james-tasks",
    "crates/james-scheduler",
    "crates/james-health",
    "crates/james-app-api",
    "crates/james-app",
    "crates/james-module-host",
    "crates/james-identity",
    "crates/james-audit",
    "crates/james-agents",
    "crates/james-platform",
    "crates/james-platform-services",
    "crates/james-platform-windows",
    "crates/james-ui",
    "crates/james-runtime-client",
    "crates/james-python-bridge",
    "crates/james-module-host-fixture",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["JAMES Project"]
repository = "https://github.com/james-project/james"
description = "JAMES Core - Local Agent & Automation Platform"

[workspace.dependencies]
# Local crates
james-core = { path = "crates/james-core" }
james-errors = { path = "crates/james-errors" }
james-events = { path = "crates/james-events" }
james-registry = { path = "crates/james-registry" }
james-capabilities = { path = "crates/james-capabilities" }
james-capability-broker = { path = "crates/james-capability-broker" }
james-services = { path = "crates/james-services" }
james-tasks = { path = "crates/james-tasks" }
james-scheduler = { path = "crates/james-scheduler" }
james-health = { path = "crates/james-health" }
james-app-api = { path = "crates/james-app-api" }
james-app = { path = "crates/james-app" }
james-module-host = { path = "crates/james-module-host" }
james-identity = { path = "crates/james-identity" }
james-audit = { path = "crates/james-audit" }
james-agents = { path = "crates/james-agents" }
james-platform = { path = "crates/james-platform" }
james-platform-services = { path = "crates/james-platform-services" }
james-platform-windows = { path = "crates/james-platform-windows" }
james-ui = { path = "crates/james-ui" }
james-runtime-client = { path = "crates/james-runtime-client" }
james-python-bridge = { path = "crates/james-python-bridge" }

# Core dependencies
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.7", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
async-trait = "0.1"
libloading = "0.8"
once_cell = "1.19"
toml = "0.8"
config = { version = "0.14", features = ["toml"] }
clap = { version = "4.5", features = ["derive", "env"] }
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
sha2 = "0.10"

# NATS for Python bridge
async-nats = { version = "0.36" }
futures = "0.3"

# Serialization
bincode = "1.3"
rmp-serde = "1.1"

# Localhost API (L3 only — never a core dependency)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Testing
tempfile = { version = "3.9" }