[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "james-ai"
version = "0.1.0"
description = "Modular, model-agnostic AI runtime"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
james = "james.cli:main"

[tool.setuptools.packages.find]
include = ["james*"]
