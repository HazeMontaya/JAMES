name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"

    defaults:
      run:
        working-directory: james

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync workspace
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check packages/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check packages/ tests/

      - name: Type check (mypy)
        run: uv run mypy packages/

      - name: Unit + Integration + E2E tests
        run: uv run pytest tests/ -m "not slow" --cov=james_core,james_memory,james_skills,james_cli --cov-report=term-missing

      - name: Performance gates
        run: uv run pytest tests/performance/ -q

      - name: Smoke test CLI
        run: |
          uv run james doctor --json
          uv run james run "Research the market for AI note-taking apps" --priority high
          uv run james audit --limit 5

  minimal:
    name: Minimal no-NATS happy path (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: james
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-extras
      - name: Offline run (no Docker/NATS/model)
        env:
          SKIP_NATS_TESTS: "true"
        run: |
          uv run pytest tests/e2e/test_goal_runner.py tests/unit/test_security_audit.py -q
          uv run james doctor --json