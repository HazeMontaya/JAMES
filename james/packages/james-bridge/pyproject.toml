[project]
name = "james-bridge"
version = "0.1.0"
description = "JAMES Bridge - Python side of Rust/Python bridge"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "james-core>=0.1.0",
    "james-memory>=0.1.0",
    "james-skills>=0.1.0",
    "james-world>=0.1.0",
    "nats-py>=2.6.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
james-bridge = "james_bridge.main:main"

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true