[project]
name = "james-hands"
version = "0.1.0"
description = "JAMES Hands - Gesture Control & Computer Interaction (AGPL-3.0)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "pyautogui>=0.9.54",
    "james-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"