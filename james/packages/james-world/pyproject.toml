[project]
name = "james-world"
version = "0.1.0"
description = "JAMES World Access Layer - Capability Router & Adapters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "selectolax>=0.3.0",
    "readability-lxml>=0.8.0",
    "feedparser>=6.0.0",
    "cryptography>=42.0.0",
    "james-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"