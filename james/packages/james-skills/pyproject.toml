[project]
name = "james-skills"
version = "0.1.0"
description = "JAMES Skill Engine - Operational Skills with Plan/Execute/Verify/Learn"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "james-core>=0.1.0",
    "james-memory>=0.1.0",
    "james-world>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"