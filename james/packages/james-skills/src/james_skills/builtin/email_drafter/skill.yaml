skill:
  name: email_drafter
  version: "1.0.0"
  category: communication
  description: "Draft professional emails and messages from context"
  purpose: "Write clear, scenario-appropriate email drafts based on recipient, tone, and objective"
  status: enabled
  prerequisites:
    - llm_reasoning
  tags:
    - communication
    - email
    - outreach
    - writing

  entry_point: james_skills.builtin.email_drafter.skill:execute

  inputs:
    - name: recipient
      type: string
      required: true
      description: "Recipient name or title"
    - name: objective
      type: string
      required: true
      description: "What the email should accomplish"
    - name: tone
      type: string
      required: false
      description: "Tone: formal, friendly, persuasive, concise (default: professional)"

  outputs:
    - name: email
      type: string
      description: "Ready-to-send email draft"

  steps:
    - id: draft
      type: llm
      name: "Draft Email"
      description: "Compose the email body"
      inputs:
        instructions: "Write a clear, concise email that achieves the objective for the recipient."

  metrics:
    - word_count
    - clarity_score

  verification:
    - type: criteria
      criteria:
        - contains:Dear
        - min_length:120
        - no_error
      min_score: 0.66

  failure_modes:
    - missing_context
    - wrong_tone