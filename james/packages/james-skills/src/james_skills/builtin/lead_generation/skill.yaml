skill:
  name: lead_generation
  version: "1.0.0"
  category: business
  description: "Generate qualified leads for a product or service"
  purpose: "Identify potential customers and outreach angles for a given offer"
  status: enabled
  prerequisites:
    - llm_reasoning
  tags:
    - business
    - lead
    - sales
    - outreach

  entry_point: james_skills.builtin.lead_generation.skill:execute

  inputs:
    - name: offer
      type: string
      required: true
      description: "The product or service being sold"

  outputs:
    - name: leads
      type: string
      description: "Structured lead list with outreach suggestions"

  steps:
    - id: generate_leads
      type: llm
      name: "Generate Leads"
      description: "Produce a structured lead-generation analysis"
      inputs:
        instructions: "Define ideal customer profiles, lead sources, and outreach templates."

  metrics:
    - channels_identified
    - outreach_templates

  verification:
    - type: criteria
      criteria:
        - contains:lead
        - contains:outreach
        - min_length:300
      min_score: 0.66

  failure_modes:
    - narrow_scope
    - missing_channels