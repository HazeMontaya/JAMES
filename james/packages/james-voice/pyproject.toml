[project]
name = "james-voice"
version = "0.1.0"
description = "JAMES Voice Pipeline - STT/TTS with Local-First Architecture (AGPL-3.0)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "faster-whisper>=1.0.0",
    "kokoro-onnx>=0.3.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "james-core>=0.1.0",
]

[project.optional-dependencies]
cloud = [
    "elevenlabs>=0.2.0",
    "openai>=1.30.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"