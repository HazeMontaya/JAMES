[project]
name = "james-cli"
version = "0.1.0"
description = "JAMES CLI - Main Entry Point"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "james-core>=0.1.0",
    "james-memory>=0.1.0",
    "james-skills>=0.1.0",
    "james-world>=0.1.0",
    "james-bootstrap>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
james = "james_cli.main:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"