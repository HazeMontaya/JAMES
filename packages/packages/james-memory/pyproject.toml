[project]
name = "james-memory"
version = "0.1.0"
description = "JAMES Memory System - Hybrid SQLite + Markdown Vault"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "aiofiles>=23.2.0",
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0.0",
    "pyyaml>=6.0.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"