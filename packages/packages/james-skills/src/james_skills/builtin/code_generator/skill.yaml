skill:
  name: code_generator
  version: "1.0.0"
  category: engineering
  description: "Generate well-structured code and project scaffolds from requirements"
  purpose: "Turn plain-language requirements into idiomatic code files"
  status: enabled
  prerequisites:
    - llm_reasoning
  tags:
    - engineering
    - code
    - scaffolding
    - automation

  entry_point: james_skills.builtin.code_generator.skill:execute

  inputs:
    - name: language
      type: string
      required: true
      description: "Target programming language"
    - name: requirements
      type: string
      required: true
      description: "Plain-language feature requirements"

  outputs:
    - name: code
      type: string
      description: "Generated code with structure overview"

  steps:
    - id: generate
      type: llm
      name: "Generate Code"
      description: "Produce idiomatic code from the requirements"
      inputs:
        instructions: "Generate clean, well-structured code implementing the requirements."

  metrics:
    - files_generated
    - lines_of_code

  verification:
    - type: criteria
      criteria:
        - contains:def
        - contains:class
        - min_length:300
      min_score: 0.6

  failure_modes:
    - ambiguous_requirements
    - unsupported_language