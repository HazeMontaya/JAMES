[package]
name = "james-void"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "James-Void - Cosmic executive interface for JAMES"

[dependencies]
james-core = { path = "../../core/crates/james-core" }
james-events = { path = "../../core/crates/james-events" }
james-registry = { path = "../../core/crates/james-registry" }
james-capabilities = { path = "../../core/crates/james-capabilities" }
james-module-host = { path = "../../core/crates/james-module-host" }
james-chat = { path = "../james-chat" }
james-ai = { path = "../james-ai" }
james-memory = { path = "../james-memory" }
james-tasks.workspace = true
james-webresearch = { path = "../james-webresearch" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
schemars = "0.8"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
futures-util = "0.3"

[lib]
name = "james_void"
path = "src/lib.rs"