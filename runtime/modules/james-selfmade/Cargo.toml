[package]
name = "james-selfmade"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JAMES-SelfMade - bounded autonomous development and self-improvement runtime"

[dependencies]
james-events = { path = "../../core/crates/james-events" }
james-capabilities = { path = "../../core/crates/james-capabilities" }
james-module-host = { path = "../../core/crates/james-module-host" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "james_selfmade"
path = "src/lib.rs"
