[project]
name = "james-runtime"
version = "0.1.0"
description = "JAMES AI Runtime Abstraction Layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=4.25",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "GPUtil>=1.4",
    "pandas>=2.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.4.0", "torch>=2.3", "transformers>=4.40", "accelerate>=0.30"]
llamacpp = ["llama-cpp-python>=0.2.90"]
airllm = ["airllm @ git+https://github.com/cortextorlab/airLLM@main", "torch>=2.3", "transformers>=4.40", "accelerate>=0.30"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

cuda = ["llama-cpp-python[cu121]>=0.2.90"]
rocm = ["llama-cpp-python[hip]>=0.2.90"]
metal = ["llama-cpp-python[metal]>=0.2.90"]
vulkan = ["llama-cpp-python[vulkan]>=0.2.90"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["james_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
