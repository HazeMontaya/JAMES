[package]
name = "james-diagnostics"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JAMES Diagnostics - CLI and status reporting (standalone, no core dependency cycle)"

[[bin]]
name = "james-diagnostics"
path = "src/main.rs"

[dependencies]
james-core = { path = "../../core/crates/james-core" }
james-events = { path = "../../core/crates/james-events" }
james-registry = { path = "../../core/crates/james-registry" }
james-capabilities = { path = "../../core/crates/james-capabilities" }
james-services = { path = "../../core/crates/james-services" }
james-tasks = { path = "../../core/crates/james-tasks" }
james-scheduler = { path = "../../core/crates/james-scheduler" }
james-health = { path = "../../core/crates/james-health" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
tabled = "0.16"
