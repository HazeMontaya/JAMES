[package]
name = "james-financial-research"
version = "0.1.0"
edition = "2021"
description = "JAMES Financial Research Orchestrator - Technical analysis, news sentiment, fundamentals, and research synthesis"
license = "MIT"

[dependencies]
# JAMES Core
james-core = { workspace = true }
james-capabilities = { workspace = true }
james-registry = { workspace = true }
james-module-host = { workspace = true }
james-errors = { workspace = true }
james-events = { workspace = true }

# Module dependencies
james-adapter-kronos = { path = "../james-adapter-kronos" }
james-market-data = { path = "../james-market-data" }

# Async & Serialization
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }

# HTTP & Data
reqwest = { workspace = true }
rust_decimal = "1.34"

# Metrics
metrics = "0.21"
tracing = { workspace = true }

[lib]
name = "james_financial_research"