[package]
name = "james-market-data"
version = "0.1.0"
edition = "2021"
description = "JAMES Market Data Engine - Multi-provider OHLCV data with Kronos normalization"
license = "MIT"

[dependencies]
# JAMES Core
james-core = { workspace = true }
james-capabilities = { workspace = true }
james-registry = { workspace = true }
james-module-host = { workspace = true }
james-errors = { workspace = true }
james-events = { workspace = true }

# Async & Serialization
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }

# HTTP & Data
reqwest = { workspace = true }
csv = "1.3"
rust_decimal = "1.34"
url = "2.5"

# Config
config = "0.14"

# Metrics
metrics = "0.21"
tracing = { workspace = true }

[lib]
name = "james_market_data"